// AgentFlow 编排引擎通信契约
// 定义 Go Orchestration Engine 与 Python Agent Runtime 之间的 gRPC 接口

syntax = "proto3";

package orchestration.v1;

// Go 代码的输出路径
option go_package = "github.com/Rainnylxy/AgentFlow/engine/proto/orchestration/v1;orchestrationv1";

// --- 消息定义 ---

// 编排引擎向 Agent Runtime 发起的执行请求
message ExecuteNodeRequest {
    string workflow_id = 1;
    string node_id = 2;
    string agent_type = 3;        // "react" | "plan_execute"
    string system_prompt = 4;
    string user_input = 5;
    repeated Tool tools = 6;
    MemoryContext memory = 7;
}

message Tool {
    string name = 1;
    string description = 2;
    string schema_json = 3;       // JSON Schema of tool parameters
    string type = 4;              // "mcp" | "rest" | "local"
    string endpoint = 5;
}

message MemoryContext {
    repeated Message short_term = 1;
    repeated Message long_term_hits = 2;
}

message Message {
    string role = 1;
    string content = 2;
}

message ExecuteNodeResponse {
    string node_id = 1;
    string status = 2;            // "success" | "failed" | "timeout"
    string output = 3;
    repeated ToolCall tool_calls = 4;
    int64 duration_ms = 5;
    string error = 6;
}

message ToolCall {
    string tool_name = 1;
    string input_json = 2;
    string output_json = 3;
}

// --- 服务定义 ---

// Agent Runtime 暴露给编排引擎的 gRPC 服务
service AgentRuntime {
    rpc ExecuteNode(ExecuteNodeRequest) returns (ExecuteNodeResponse);
}
